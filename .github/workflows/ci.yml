name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ghusn
          POSTGRES_PASSWORD: ghusn_dev_password
          POSTGRES_DB: ghusn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghusn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: cp .env.example .env

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Migrations and seed apply cleanly
        run: |
          pnpm --filter @ghusn/db migrate:deploy
          pnpm db:seed

      - name: Build
        run: pnpm build
